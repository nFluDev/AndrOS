services:
  signal:
    build: .
    restart: unless-stopped
    environment:
      # Dokploy alan adini bu porta baglar.
      PORT: ${PORT:-3000}
      STUN_PORT: ${STUN_PORT:-3478}
      # Numara ozetlerinin tuzu. DEGISTIRME: degisirse tum numara
      # eslemeleri gecersiz olur.
      SIGNAL_SALT: ${SIGNAL_SALT}
    ports:
      # STUN'un UDP portu disaridan erisilebilir OLMALI; dis adresi
      # ogrenmenin baska yolu yok.
      - "${STUN_PORT:-3478}:3478/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
